name: Job lifecycle regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  job-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Test durable job lifecycle
        run: python -m unittest discover -s tests -v
